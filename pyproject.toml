[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcamsim"
version = "1.3.0"
description = "Virtual ONVIF cameras with RTSP streaming and fault injection for VMS testing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0,<7", "PySide6>=6.8,<7"]

[project.optional-dependencies]
service = ["pywin32>=308; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyinstaller>=6,<7"]

[project.scripts]
vcamsim = "vcamsim.cli:main"

[tool.setuptools.packages.find]
include = ["vcamsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
